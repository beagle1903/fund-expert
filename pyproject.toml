[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundexpert"
version = "0.1.0"
description = "CLI that recommends a Turkish investment-fund portfolio from TEFAS/BEFAS CSVs."
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=20.0",
    "rich>=13.7",
    "questionary>=2.0",
    "pandera>=0.18.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.141.1,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.52.1,<1",
]
dev = [
    "hypothesis[pandas]>=6.165.0",
    "httpx2>=2.9,<3",
    "pdoc>=16,<17",
    "pip-tools>=7.5,<8",
    "pytest>=8.0,<9.2.0",
    "pytest-cov>=7,<8",
    "vulture>=2.11",
]

[project.scripts]
fundexpert = "fundexpert.cli:main"

[tool.setuptools.packages.find]
include = ["fundexpert*"]
exclude = ["tests*", "docs*", "data*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=fundexpert --cov-fail-under=90"

[tool.coverage.run]
data_file = ".pytest_cache/.coverage"
